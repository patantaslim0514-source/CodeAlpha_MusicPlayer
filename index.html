

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern responsive music player.">
  <title>Melodia | Music Player</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a href="#" class="logo"><span>♫</span> Melodia</a>
      <span class="top-label">YOUR MUSIC SPACE</span>
    </header>

    <section class="player-layout">
      <!-- Album artwork -->
      <div class="player-main">
        <div class="section-heading">
          <p class="eyebrow">NOW PLAYING</p>
          <h1>Your Music Player</h1>
        </div>

        <div class="album-art" id="album-art">
          <img
            id="cover-image"
            src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=700"
            alt="Music album artwork"
          >
          <div class="art-overlay">
            <span>MELODIA</span>
          </div>
        </div>

        <div class="song-details">
          <div>
            <h2 id="song-title">Midnight Dreams</h2>
            <p id="song-artist">Luna Waves</p>
          </div>
          <button class="favorite-btn" id="favorite-btn"
            type="button" aria-label="Add to favorites"
            aria-pressed="false">♡</button>
        </div>

        <!-- Audio progress -->
        <div class="progress-section">
          <input type="range" id="progress" min="0" max="100"
            value="0" step="0.1" aria-label="Song progress">
          <div class="time-row">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <!-- Audio controls -->
        <div class="controls">
          <button id="shuffle-btn" class="control-btn"
            type="button" aria-label="Shuffle">⤨</button>
          <button id="prev-btn" class="control-btn"
            type="button" aria-label="Previous song">|◀</button>
          <button id="play-btn" class="play-btn"
            type="button" aria-label="Play">▶</button>
          <button id="next-btn" class="control-btn"
            type="button" aria-label="Next song">▶|</button>
          <button id="repeat-btn" class="control-btn"
            type="button" aria-label="Repeat">↻</button>
        </div>

        <div class="volume-section">
          <span aria-hidden="true">🔈</span>
          <input type="range" id="volume" min="0" max="1"
            step="0.01" value="0.7" aria-label="Volume">
          <span aria-hidden="true">🔊</span>
        </div>

        <audio id="audio"></audio>
      </div>

      <!-- Playlist -->
      <aside class="playlist">
        <div class="playlist-heading">
          <div>
            <p class="eyebrow">YOUR COLLECTION</p>
            <h2>Playlist</h2>
          </div>
          <span class="track-count" id="track-count">4 tracks</span>
        </div>

        <div class="playlist-items" id="playlist-items">
          <button class="track active" type="button" data-index="0">
            <span class="track-number">01</span>
            <span class="track-info">
              <strong>Midnight Dreams</strong>
              <small>Luna Waves</small>
            </span>
            <span class="track-symbol">♫</span>
          </button>

          <button class="track" type="button" data-index="1">
            <span class="track-number">02</span>
            <span class="track-info">
              <strong>Golden Hour</strong>
              <small>Nova Sky</small>
            </span>
            <span class="track-symbol">♫</span>
          </button>

          <button class="track" type="button" data-index="2">
            <span class="track-number">03</span>
            <span class="track-info">
              <strong>Ocean Breeze</strong>
              <small>Blue Horizon</small>
            </span>
            <span class="track-symbol">♫</span>
          </button>

          <button class="track" type="button" data-index="3">
            <span class="track-number">04</span>
            <span class="track-info">
              <strong>City Lights</strong>
              <small>Echo Lane</small>
            </span>
            <span class="track-symbol">♫</span>
          </button>
        </div>

        <p class="playlist-note">Select a song to start listening.</p>
      </aside>
    </section>

    <footer class="footer">
      <p>Made with ♡ by Taslim | CodeAlpha Internship</p>
    </footer>
  </main>
</body>
</html>
